<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRYX Skin Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf5ff;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;right:18px;top:18px;width:290px;max-height:94vh;overflow:auto;background:#141d2bed;border:1px solid #374357;border-radius:12px;padding:20px}h1{font-size:20px;margin:0 0 8px}p{color:#a9b9ce;line-height:1.5}label{display:block;margin:15px 0 7px}select,button{width:100%;padding:10px;background:#253246;color:white;border:1px solid #495971;border-radius:6px}button{cursor:pointer;margin-top:10px}a{color:#79e8d7}.check{display:flex;gap:10px;align-items:center}#status{position:fixed;bottom:22px;left:24px;max-width:60%;pointer-events:none}#status strong{display:block;font-size:22px}details summary{cursor:pointer;font-weight:700}@media(max-width:650px){aside{width:210px;right:8px;top:8px;padding:12px}aside p{display:none}}
aside{right:15px;top:0;width:245px;padding:0;border:0;border-radius:0;background:#171717e8;font:11px Arial}aside h1,aside>p{display:none}label{margin:0;padding:7px 8px;border-bottom:1px solid #303030}select{font-size:11px;border:0;border-radius:0;padding:5px;background:#303030}button{font-size:11px;margin:0;border:0;border-radius:0;background:#080808;padding:7px}details summary{padding:8px;background:#080808}.check{justify-content:space-between;flex-direction:row-reverse;padding-right:120px;white-space:nowrap;gap:6px}.check input{margin:0}#status{font-size:12px;opacity:.7}aside.closed>*:not(#toggle){display:none}</style></head><body><canvas aria-label="Interactive character preview"></canvas><aside><h1>KRYX / SKIN PREVIEW</h1><p>Drag to orbit · Scroll to zoom. The same models, weapon grips and animation rig used in the game.</p><label class="check"><input type="checkbox" id="walk">Walk</label><label class="check"><input type="checkbox" id="run">Run</label><label class="check"><input type="checkbox" id="crouch">Crouch</label><label class="check"><input type="checkbox" id="rotate">Auto Rotate</label><label class="check"><input type="checkbox" id="look">Look Up Down</label><label class="check"><input type="checkbox" id="dance">Just Dance</label><details><summary>All Skins</summary><label for="character">Character skin</label><select id="character"></select><label for="weapon">Weapon & skin</label><select id="weapon"></select></details><details><summary>More animations</summary><label for="motion">Movement</label><select id="motion"><option value="idle">Idle</option><option value="walk">Walk</option></select><button id="jump">Jump</button><button id="fire">Fire / sword attack</button><button id="reset">Reset camera</button></details><p><a href="/">Back to game</a></p><button id="toggle">Close Controls</button></aside><div id="status" role="status">Loading models…</div><script type="module" src="/src/ui/SkinPreviewPage.js"></script></body></html>
