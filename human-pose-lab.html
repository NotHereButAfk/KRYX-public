<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human weapon pose lab</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #252a31; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { preloadHumanSoldier, buildHumanSoldier } from '/src/player/HumanSoldier.js';
import { buildWeaponModel } from '/src/weapons/WeaponModels.js';
import { getWeapon } from '/src/weapons/weaponDefs.js';

const query = new URLSearchParams(location.search);
const angle = Number(query.get('angle') || 0) * Math.PI / 180;
const aim = THREE.MathUtils.clamp(Number(query.get('aim') || 0), 0, 1);
const armor = query.get('armor') || 'assault';
const motion = query.get('motion') || 'idle';
const speed = Number(query.get('speed') || (motion === 'run' ? 8 : motion === 'walk' ? 3.2 : 0));
const sprint = query.get('sprint') === '1';
const grounded = query.get('grounded') !== '0';
const dirF = Number(query.get('dirF') ?? 1);
const dirR = Number(query.get('dirR') ?? 0);
const strafe = Number(query.get('strafe') ?? dirR);
const pitch = Number(query.get('pitch') || 0);
const reload = THREE.MathUtils.clamp(Number(query.get('reload') || 0), 0, 1);
const crouch = THREE.MathUtils.clamp(Number(query.get('crouch') || 0), 0, 1);
const slide = THREE.MathUtils.clamp(Number(query.get('slide') || 0), 0, 1);
const action = query.get('action');
const actionSeconds = Math.max(0, Number(query.get('actionSeconds') || 0.22));
const weaponId = query.get('weapon') || 'm4';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x252a31);
scene.add(new THREE.HemisphereLight(0xf4f7ff, 0x30343d, 2.4));
const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(-2.5, 4.5, -3.5);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0x78d5ff, 1.5);
rim.position.set(3, 2.5, 3);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.4, 64),
  new THREE.MeshStandardMaterial({ color: 0x343b45, roughness: 0.92 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.GridHelper(5, 20, 0x596675, 0x3f4854));

const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.02, 20);
camera.position.set(Math.sin(angle) * 3.4, 1.18, -Math.cos(angle) * 3.4);
camera.lookAt(0, 0.96, 0);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

preloadHumanSoldier(() => {
  const body = buildHumanSoldier(null, armor);
  scene.add(body);
  const weapon = buildWeaponModel(getWeapon(weaponId), { procedural: true }).group;
  weapon.traverse((object) => {
    if (object.isMesh) {
      object.castShadow = true;
      object.frustumCulled = false;
    }
  });
  body.userData.attachWeapon(weapon, false);
  body.userData.setLocomotion?.(speed, grounded, sprint, strafe, dirF, dirR);
  body.userData.setAim?.(pitch, 0);
  body.userData.setActionState?.({
    aim, reload, crouch, slide, vy: grounded ? 0 : 1.5,
  });
  // Settle the same animation/IK path used in a live match.
  for (let i = 0; i < 90; i++) {
    body.userData.mixer.update(1 / 60);
    body.userData.armorTick?.(1 / 60);
  }
  if (action) {
    body.userData.triggerAction?.(action);
    const frames = Math.max(1, Math.round(actionSeconds * 60));
    for (let i = 0; i < frames; i++) {
      body.userData.mixer.update(1 / 60);
      body.userData.armorTick?.(1 / 60);
    }
  }
  body.updateMatrixWorld(true);
  window.__body = body;
  window.__weapon = weapon;
  window.__ready = true;
  renderer.render(scene, camera);
});

function frame() {
  requestAnimationFrame(frame);
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
